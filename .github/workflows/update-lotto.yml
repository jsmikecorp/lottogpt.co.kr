name: 매주 로또 당첨번호 자동 업데이트

on:
  schedule:
    # 토 21:15 KST (UTC 12:15) - 추첨 직후 1차 시도 (아직 미발표면 실패 처리하지 않음)
    - cron: '15 12 * * 6'
    # 토 23:37 KST (UTC 14:37) - 2차 시도
    - cron: '37 14 * * 6'
    # 일 09:07 KST (UTC 00:07) - 재시도 (정각은 GitHub 부하로 지연이 잦아 피함)
    - cron: '7 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lotto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 최신 당첨번호 수집 및 JSON 갱신 (놓친 회차 모두 반영, 실패 시 빨간색)
        id: update
        run: python3 scripts/update_lotto.py

      - name: 변경 사항 커밋 및 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lotto.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            ROUND=$(python3 -c "import json;print(json.load(open('data/lotto.json'))['latestRound'])")
            git commit -m "chore: 제${ROUND}회 로또 당첨번호 자동 업데이트"
            git push
          fi
