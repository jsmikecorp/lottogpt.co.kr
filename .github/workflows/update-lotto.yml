name: 매주 로또 당첨번호 자동 업데이트

on:
  schedule:
    - cron: '15 12 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 최신 당첨번호 수집 및 JSON 갱신
        run: python3 scripts/update_lotto.py

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lotto.json
          git diff --staged --quiet || (git commit -m "chore: 최신 로또 당첨번호 자동 업데이트" && git push)
